name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify with isolated H2 tests
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Build runtime image
        run: docker build --tag authority_management_backend:ci .
